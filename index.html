<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>からだノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF2; --card:#FFFFFF; --ink:#16222E; --sub:#5B6B7A; --line:#D3DCE3;
  --ok:#0E8F7A; --okSoft:#D5EFEA; --warn:#B87809; --warnSoft:#F7E8CC;
  --over:#D2453F; --overSoft:#F6D9D7; --btn:#16222E; --btnInk:#FFFFFF; --key:#F3F6F8;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1720; --card:#18232F; --ink:#E8EEF3; --sub:#93A3B2; --line:#2A3847;
    --ok:#3CC7AE; --okSoft:#123A34; --warn:#E8B04A; --warnSoft:#3A2E15;
    --over:#F07870; --overSoft:#3D1E1C; --btn:#E8EEF3; --btnInk:#0F1720; --key:#223040;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1720; --card:#18232F; --ink:#E8EEF3; --sub:#93A3B2; --line:#2A3847;
  --ok:#3CC7AE; --okSoft:#123A34; --warn:#E8B04A; --warnSoft:#3A2E15;
  --over:#F07870; --overSoft:#3D1E1C; --btn:#E8EEF3; --btnInk:#0F1720; --key:#223040;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg)}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;line-height:1.5}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 130px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top h1{font-size:1.15rem;font-weight:800}
.top .date{color:var(--sub);font-size:.9rem}
.gear{width:44px;height:44px;border-radius:50%;background:var(--card);font-size:1.2rem}
.datenav{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:18px;padding:6px;margin-bottom:10px;border:3px solid transparent}
.datenav.past{border-color:var(--warn);background:var(--warnSoft)}
.dbtn{width:52px;height:52px;border-radius:14px;background:var(--bg);font-size:1.2rem;font-weight:800;flex:none}
.dbtn:disabled{opacity:.3;cursor:default}
.dmid{flex:1;text-align:center;line-height:1.3}
.dtxt{font-size:1.15rem;font-weight:800}
.dsub{font-size:.82rem;color:var(--sub);font-weight:700}
.dsub button{color:var(--ok);text-decoration:underline;font-weight:800}
button.day{width:100%;font:inherit;color:inherit}
.timein{font:inherit;font-size:2.4rem;font-weight:800;padding:14px;border-radius:18px;border:3px solid var(--line);background:var(--card);color:var(--ink);width:100%;text-align:center}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--sub);margin:-4px 0 12px 2px}
.legend b{color:var(--ink)}

.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:12px}
.card h2{font-size:.95rem;font-weight:700;color:var(--sub);margin-bottom:10px}

.clock{position:relative;width:min(260px,72vw);margin:0 auto}
.clock svg{display:block;width:100%;height:auto}
.clock .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 40px}
.clock .big{font-size:2.5rem;font-weight:800;line-height:1.1}
.clock .small{font-size:.82rem;color:var(--sub);margin-top:4px}
.clock .lead{font-size:1.05rem;font-weight:700}

.meters{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.meter .label{font-size:.9rem;color:var(--sub);font-weight:700}
.meter .num{font-size:1.6rem;font-weight:800;line-height:1.2}
.meter .num small{font-size:.8rem;color:var(--sub);font-weight:500}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--ok);transition:width .4s}
.bar.warn i{background:var(--warn)} .bar.over i{background:var(--over)}
.tbar{position:relative;margin:10px 0 22px}
.tick{position:absolute;top:-4px;width:3px;height:20px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}
.tlab{position:absolute;top:17px;font-size:.66rem;color:var(--sub);transform:translateX(-50%);white-space:nowrap}
.tlab.r{transform:translateX(-100%)}
.msg{font-size:.85rem;font-weight:700}
.ok-t{color:var(--ok)} .warn-t{color:var(--warn)} .over-t{color:var(--over)} .sub-t{color:var(--sub);font-weight:500}

.meals{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.meal{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:.95rem}
.meal .t{color:var(--sub);width:3.2em;flex:none}
.meal .v{flex:1}
.meal button{width:36px;height:36px;border-radius:50%;color:var(--sub);flex:none}
.meal button.reg{width:auto;padding:0 12px;border-radius:12px;background:var(--okSoft);color:var(--ok);font-weight:800;font-size:.85rem}
.empty{color:var(--sub);font-size:.9rem}

.wrow{display:flex;align-items:baseline;gap:8px}
.wrow .num{font-size:2.2rem;font-weight:800}
.wrow .unit{color:var(--sub)}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 4px}
.goal{background:var(--bg);border-radius:14px;padding:10px 12px}
.goal .k{font-size:.78rem;color:var(--sub);font-weight:700}
.goal .v{font-weight:800}
.goal.done{background:var(--okSoft)}
.chart{margin-top:10px}
.chart svg{width:100%;height:auto;display:block}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.day{border-radius:14px;background:var(--bg);padding:6px 0;text-align:center;min-height:74px}
.day .w{font-size:.75rem;color:var(--sub)}
.day .ic{font-size:1.15rem;height:1.6em;line-height:1.6em}
.day .m{font-size:.7rem;color:var(--sub)}
.day.today{outline:2px solid var(--ink)}
.day.str{background:var(--okSoft)}
.day.future{opacity:.45}
.day.bad{background:var(--warnSoft)}
.exrow{display:flex;align-items:center;gap:10px}
.exrow .l{width:3.6em;font-weight:700;flex:none}
.exrow .tbar{flex:1;margin:10px 0 22px}
.exrow .n{width:4.8em;text-align:right;font-weight:700;flex:none}
.ex-msg{font-weight:700;margin-top:2px}

.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.dock-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.big-btn{background:var(--btn);color:var(--btnInk);border-radius:18px;height:76px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;transition:transform .08s}
.big-btn span{font-size:1.5rem;line-height:1.1}
.big-btn:active{transform:scale(.96)}

.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet[hidden]{display:none}
.sheet-in{max-width:520px;margin:0 auto;padding:14px 16px 24px;min-height:100%;display:flex;flex-direction:column}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cancel{padding:10px 14px;border-radius:12px;background:var(--card);font-weight:700}
.stepno{color:var(--sub);font-weight:700}
.q{font-size:1.45rem;font-weight:800;margin-bottom:6px}
.note{color:var(--sub);margin-bottom:14px}
.note.warn{color:var(--warn);font-weight:700}
.display{background:var(--card);border-radius:18px;padding:14px 18px;display:flex;align-items:baseline;justify-content:flex-end;gap:8px;
  font-size:3rem;font-weight:800;min-height:88px;border:3px solid transparent}
.display .u{font-size:1.1rem;color:var(--sub)}
.err{border-color:var(--over)!important;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.err-msg{color:var(--over);font-weight:700;min-height:1.5em;margin:6px 2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{background:var(--card);border-radius:14px;padding:8px 12px;text-align:left;line-height:1.3;border:2px solid var(--line)}
.chip b{display:block;font-size:.95rem}
.chip small{color:var(--sub);font-size:.75rem}
.when{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:700}
.when input{font:inherit;font-size:1.1rem;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto}
.key{height:64px;border-radius:16px;background:var(--key);font-size:1.6rem;font-weight:700}
.key:active{transform:scale(.96)}
.okbtn{grid-column:1/-1;height:70px;border-radius:18px;background:var(--ok);color:#fff;font-size:1.3rem;font-weight:800;width:100%}
.choices{display:grid;gap:12px;margin-top:8px}
.choice{background:var(--card);border-radius:20px;padding:20px 22px;text-align:left;font-size:1.25rem;font-weight:800;border:3px solid var(--line)}
.choice small{display:block;font-size:.88rem;color:var(--sub);font-weight:500;margin-top:2px}
.choice.danger{color:var(--over)}
.foods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.food{background:var(--card);border-radius:16px;padding:12px 14px;text-align:left;border:2px solid var(--line);min-height:72px;line-height:1.35}
.food b{display:block;font-size:1rem;word-break:break-all}
.food small{color:var(--sub);font-size:.78rem}
.food:active{transform:scale(.97)}
.subbtns{display:grid;gap:10px;margin-top:auto}
.subbtn{background:var(--card);border-radius:16px;padding:16px;font-weight:800;font-size:1.05rem;border:2px dashed var(--line)}
.tinput{font:inherit;font-size:1.4rem;padding:16px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);width:100%;margin-bottom:6px}
.list{display:grid;gap:8px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 14px}
.row .v{flex:1}
.row small{color:var(--sub)}
.row button{width:40px;height:40px;border-radius:50%;background:var(--bg);color:var(--over);font-weight:800;flex:none}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:4px 0 10px}
.tab{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:700}
.tab.on{background:var(--btn);color:var(--btnInk);border-color:var(--btn)}
button.row{width:100%;text-align:left;border:2px solid transparent}
button.row:active{border-color:var(--ok)}
.row .go{color:var(--sub);font-size:1.4rem}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.size{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:12px 4px;font-weight:800;line-height:1.3}
.size small{display:block;color:var(--sub);font-weight:500;font-size:.75rem}
.size.on{border-color:var(--ok);background:var(--okSoft)}
.est{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.estbox{background:var(--card);border-radius:18px;padding:16px;text-align:center}
.estbox .k{color:var(--sub);font-weight:700;font-size:.9rem}
.estbox .v{font-size:2.2rem;font-weight:800;line-height:1.2}
.estbox .v small{font-size:.9rem;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--btn);color:var(--btnInk);padding:12px 16px;border-radius:14px;display:flex;gap:14px;align-items:center;z-index:30;max-width:92vw;font-weight:700}
.toast[hidden]{display:none}
.toast button{color:var(--btnInk);text-decoration:underline;font-weight:800}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>からだノート</h1>
    <button class="gear" id="gear" aria-label="設定">⚙️</button>
  </div>
  <div class="datenav" id="dnav">
    <button class="dbtn" id="dPrev" aria-label="前の日">◀</button>
    <div class="dmid"><div class="dtxt" id="today"></div><div class="dsub" id="dsub"></div></div>
    <button class="dbtn" id="dNext" aria-label="次の日">▶</button>
  </div>
  <div class="legend"><span><b>標準</b>＝最低ライン</span><span><b>ハード</b>＝がんばる目標</span></div>

  <section class="card"><h2>食事の時間（ハード10時間・標準12時間）</h2><div class="clock" id="clock"></div></section>
  <section class="card"><h2 id="mealTitle">今日の食事</h2><div class="meters" id="meters"></div><div class="meals" id="meals"></div></section>
  <section class="card"><h2>体重</h2><div id="weight"></div></section>
  <section class="card"><h2 id="weekTitle">今週の運動</h2><div id="week"></div></section>
</div>

<nav class="dock"><div class="dock-in">
  <button class="big-btn" id="bMeal"><span>🍙</span>食事</button>
  <button class="big-btn" id="bWeight"><span>⚖️</span>体重</button>
  <button class="big-btn" id="bEx"><span>🏃</span>運動</button>
</div></nav>

<div class="sheet" id="sheet" hidden><div class="sheet-in">
  <div class="sheet-head"><button class="cancel" id="cancel">やめる</button><span class="stepno" id="stepno"></span></div>
  <div id="sheetBody" style="display:flex;flex-direction:column;flex:1"></div>
</div></div>

<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="toastUndo">取り消す</button></div>

<script>
const KEY='karada-note-v1', DAY=864e5;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const fmt=n=>Math.round(n).toLocaleString('ja-JP');
const r1=n=>Math.round(n*10)/10;
const f1=n=>r1(n).toFixed(1);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const DEFAULT_FOODS=[['おにぎり',180,4],['ゆで卵',80,6.2],['納豆',90,8.3],['サラダチキン',110,24],['プロテイン',120,20],
  ['鶏むね100g',120,23],['ギリシャヨーグルト',90,10],['ごはん150g',234,3.8],['牛乳200ml',134,6.6],['無糖コーヒー',5,0.4]];

let S=load();
function blank(){return{startWeight:null,startDate:null,goalLoss:5,sex:null,weights:[],meals:[],workouts:[],foods:null,commuteMin:null}}
function load(){let v=null;try{v=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!v||!Array.isArray(v.weights))v=blank();
  if(!Array.isArray(v.foods))v.foods=DEFAULT_FOODS.map((f,i)=>({id:'d'+i,name:f[0],kcal:f[1],protein:f[2],uses:0}));
  if(!v.goalLoss)v.goalLoss=5;return v}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('保存できませんでした')}}

/* ===== 目標の計算 ===== */
const todayKey=()=>dkey(new Date());
function curWeight(){const w=[...S.weights].sort((a,b)=>a.date<b.date?-1:1);return w.length?w[w.length-1].kg:S.startWeight}
function T(){
  const w=curWeight(),f=S.sex==='f',base=f?31:35,floor=f?1200:1500;
  const kcalHard=Math.max(Math.round(w*base*0.75),floor);
  const kcalStd=Math.max(Math.round(w*base*0.85),kcalHard);
  const protHard=r1(w*2.2), protStd=r1(Math.min(Math.max(w*1.2,f?50:65),protHard));
  const lossHard=S.goalLoss, lossStd=Math.min(r1(S.startWeight*0.03),lossHard);
  return{kcalStd,kcalHard,protStd,protHard,winStd:12,winHard:10,strStd:2,strHard:3,cardioStd:150,cardioHard:150,lossStd,lossHard}
}
let viewKey=null;
const vKey=()=>viewKey||todayKey();
const isToday=()=>vKey()===todayKey();
const parseKey=k=>{const[y,m,d]=k.split('-');return new Date(+y,+m-1,+d)};
const shiftKey=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d)};
const dayMeals=()=>S.meals.filter(m=>dkey(new Date(m.ts))===vKey()).sort((a,b)=>a.ts-b.ts);
const uniqTs=t=>{while(S.meals.some(x=>x.ts===t))t++;return t};
const workoutOn=k=>S.workouts.find(w=>w.date===k);

function commit(msg,fn){const before=JSON.stringify(S);fn();save();render();
  toast(msg,()=>{S=JSON.parse(before);save();render();toast('取り消しました')})}

/* 標準・ハードの2段バー */
function tierBar(val,std,hard,isMax){
  const scale=isMax?std*1.12:Math.max(std,hard);
  let cls='';if(isMax){if(val>std)cls='over';else if(val>hard)cls='warn'}else if(val<std)cls='warn';
  const p=x=>Math.min(x/scale*100,100);
  const tk=(x,l)=>'<span class="tick" style="left:'+p(x)+'%"></span><span class="tlab'+(p(x)>85?' r':'')+'" style="left:'+p(x)+'%">'+l+'</span>';
  const ticks=std===hard?tk(std,'目標'):(isMax?tk(hard,'ハード')+tk(std,'標準'):tk(std,'標準')+tk(hard,'ハード'));
  return '<div class="tbar"><div class="bar '+cls+'"><i style="width:'+p(val)+'%"></i></div>'+ticks+'</div>';
}

/* ===== 描画 ===== */
function render(){
  if(!S.startWeight||!S.sex)return;
  if(viewKey&&viewKey>=todayKey())viewKey=null;
  const d=parseKey(vKey()),td=isToday();
  $('today').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日（'+'日月火水木金土'[d.getDay()]+'）';
  $('dnav').classList.toggle('past',!td);$('dNext').disabled=td;
  $('dsub').innerHTML=td?'今日':'過去の日を表示中・<button id="dBack">今日に戻る</button>';
  if(!td)$('dBack').onclick=()=>{viewKey=null;render()};
  $('mealTitle').textContent=td?'今日の食事':'この日の食事';
  $('weekTitle').textContent=monday(d).getTime()===monday(new Date()).getTime()?'今週の運動':'この週の運動';
  renderClock();renderMeters();renderWeight();renderWeek();
}
function polar(a,r){const rad=(a-90)*Math.PI/180;return[120+r*Math.cos(rad),120+r*Math.sin(rad)]}
function arc(a1,a2,r){const[x1,y1]=polar(a1,r),[x2,y2]=polar(a2,r);return 'M'+x1+' '+y1+' A'+r+' '+r+' 0 '+((a2-a1)>180?1:0)+' 1 '+x2+' '+y2}
const angOf=ts=>{const t=new Date(ts);return(t.getHours()*60+t.getMinutes())/1440*360};

function renderClock(){
  const t=T(),meals=dayMeals(),td=isToday(),now=td?Date.now():Infinity,R=96,H=3600e3;
  let svg='<svg viewBox="0 0 240 240" aria-hidden="true"><circle cx="120" cy="120" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="18"/>';
  [0,6,12,18].forEach(h=>{const[x,y]=polar(h*15,R-30);svg+='<text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="13" fill="var(--sub)">'+h+'</text>'});
  let center;
  if(!meals.length){
    center=td?'<div class="lead">最初の食事で</div><div class="lead">タイマー開始</div><div class="small">記録は下の「食事」から</div>'
      :'<div class="lead">この日の食事記録は</div><div class="lead">ありません</div><div class="small">下の「食事」から追加できます</div>';
  }else{
    const st=meals[0].ts,hEnd=st+t.winHard*H,sEnd=st+t.winStd*H,a0=angOf(st),deg=x=>x/DAY*360;
    svg+='<path d="'+arc(a0,a0+deg(sEnd-st),R)+'" fill="none" stroke="var(--warnSoft)" stroke-width="18" stroke-linecap="round"/>';
    svg+='<path d="'+arc(a0,a0+deg(hEnd-st),R)+'" fill="none" stroke="var(--okSoft)" stroke-width="18" stroke-linecap="round"/>';
    const el=Math.min(Math.max(now-st,0),sEnd-st);
    if(el>60e3){const col=now>=sEnd?'var(--sub)':(now>=hEnd?'var(--warn)':'var(--ok)');
      svg+='<path d="'+arc(a0,a0+deg(el),R)+'" fill="none" stroke="'+col+'" stroke-width="18" stroke-linecap="round"/>'}
    const left=x=>{const l=x-now;return Math.floor(l/H)+':'+pad(Math.floor(l%H/60e3))};
    if(now<hEnd)center='<div class="small ok-t" style="font-weight:700">ハード締切まで</div><div class="big">'+left(hEnd)+'</div><div class="small">ハード '+hm(new Date(hEnd))+'／標準 '+hm(new Date(sEnd))+'</div>';
    else if(now<sEnd)center='<div class="small warn-t" style="font-weight:700">標準締切まで</div><div class="big warn-t">'+left(sEnd)+'</div><div class="small">ハードは '+hm(new Date(hEnd))+' に終了</div>';
    else{const last=meals[meals.length-1].ts;
      const v=last<=hEnd?'<span class="ok-t">ハード達成</span>':(last<=sEnd?'<span class="warn-t">標準達成</span>':'<span class="over-t">12時間を超えました</span>');
      center='<div class="lead">'+v+'</div><div class="small">最初 '+hm(new Date(st))+' → 最後 '+hm(new Date(last))+'</div>'}
  }
  if(td){const[nx,ny]=polar(angOf(now),R);svg+='<circle cx="'+nx+'" cy="'+ny+'" r="9" fill="var(--ink)" stroke="var(--card)" stroke-width="3"/>'}
  svg+='</svg>';
  $('clock').innerHTML=svg+'<div class="center">'+center+'</div>';
}

function renderMeters(){

function renderWeight(){
  const t=T(),cur=curWeight(),lost=r1(S.startWeight-cur);
  const gS=r1(S.startWeight-t.lossStd),gH=r1(S.startWeight-t.lossHard);
  const box=(k,loss,g)=>{const done=cur<=g;return '<div class="goal'+(done?' done':'')+'"><div class="k">'+k+'　−'+loss+'kg（'+f1(g)+'kg）</div><div class="v">'+
    (done?'<span class="ok-t">クリア！</span>':'あと '+f1(cur-g)+'kg')+'</div></div>'};
  let h='<div class="wrow"><span class="num">'+f1(cur)+'</span><span class="unit">kg</span><span class="sub-t" style="margin-left:auto">開始 '+f1(S.startWeight)+'kg から '+(lost>=0?'−':'＋')+f1(Math.abs(lost))+'kg</span></div>'+
    '<div class="goals">'+box('標準',t.lossStd,gS)+box('ハード',t.lossHard,gH)+'</div>'+tierBar(Math.max(lost,0),t.lossStd,t.lossHard,false);
  const pts=[...S.weights].sort((a,b)=>a.date<b.date?-1:1).slice(-30);
  if(pts.length>=2){
    const W=320,Hh=120,vals=pts.map(p=>p.kg).concat(gH,gS),lo=Math.min(...vals)-0.5,hi=Math.max(...vals)+0.5;
    const x=i=>10+i*(W-20)/(pts.length-1),y=v=>10+(hi-v)/(hi-lo)*(Hh-20);
    const gl=(g,c,l)=>'<line x1="10" x2="'+(W-10)+'" y1="'+y(g)+'" y2="'+y(g)+'" stroke="'+c+'" stroke-dasharray="5 5" stroke-width="2"/><text x="'+(W-10)+'" y="'+(y(g)-5)+'" text-anchor="end" font-size="11" fill="'+c+'">'+l+'</text>';
    h+='<div class="chart"><svg viewBox="0 0 '+W+' '+Hh+'" aria-label="体重の推移">'+gl(gS,'var(--warn)','標準')+gl(gH,'var(--ok)','ハード')+
      '<path d="'+pts.map((p,i)=>(i?'L':'M')+x(i)+' '+y(p.kg)).join(' ')+'" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'+
      pts.map((p,i)=>'<circle cx="'+x(i)+'" cy="'+y(p.kg)+'" r="3.5" fill="var(--ink)"/>').join('')+'</svg></div>';
  }else h+='<p class="empty">毎日はかると、ここにグラフが出ます</p>';
  $('weight').innerHTML=h;
}

function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function renderWeek(){
  const t=T(),mon=monday(parseKey(vKey())),tk=vKey(),realToday=todayKey();let str=0,cardio=0,h='<div class="week">',prev=false,bad=false;
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+i);const k=dkey(d),w=workoutOn(k);
    const s=!!(w&&w.strength),c=w?w.cardio:0;if(s)str++;cardio+=c;const consec=s&&prev;if(consec)bad=true;prev=s;
    h+='<button class="day'+(k===tk?' today':'')+(k>realToday?' future':'')+(s?' str':'')+(consec?' bad':'')+'" data-day="'+k+'"'+(k>realToday?' disabled':'')+'><div class="w">'+'月火水木金土日'[i]+'</div>'+
      '<div class="ic">'+(s?'💪':(c?'🏃':''))+'</div><div class="m">'+(c?c+'分':'')+'</div></button>';
  }
  h+='</div>';
  const row=(l,v,std,hard,u)=>'<div class="exrow"><span class="l">'+l+'</span>'+tierBar(v,std,hard,false)+'<span class="n">'+v+u+'</span></div>';
  h+=row('筋トレ',str,t.strStd,t.strHard,'回')+row('有酸素',cardio,t.cardioStd,t.cardioHard,'分');
  let msg;
  if(str>=t.strHard&&cardio>=t.cardioHard)msg='<p class="ex-msg ok-t">今週のハード目標クリア！</p>';
  else if(str>=t.strStd&&cardio>=t.cardioStd){const q=[];if(str<t.strHard)q.push('筋トレあと'+(t.strHard-str)+'回');if(cardio<t.cardioHard)q.push('有酸素あと'+(t.cardioHard-cardio)+'分');
    msg='<p class="ex-msg ok-t">標準クリア！ハードまで '+q.join('、')+'</p>'}
  else{const q=[];if(str<t.strStd)q.push('筋トレあと'+(t.strStd-str)+'回');if(cardio<t.cardioStd)q.push('有酸素あと'+(t.cardioStd-cardio)+'分');
    msg='<p class="ex-msg">標準まで '+q.join('、')+'</p>'}
  if(bad)msg+='<p class="ex-msg warn-t">筋トレが連続した日があります。間に休みを入れましょう</p>';
  if(isToday()){const y=workoutOn(shiftKey(tk,-1)),tw=workoutOn(tk);
    if(y&&y.strength&&!(tw&&tw.strength))msg+='<p class="ex-msg sub-t">昨日は筋トレの日。今日は有酸素だけがおすすめ</p>'}
  msg+='<p class="ex-msg sub-t" style="font-size:.8rem">日付のマスを押すと、その日の運動を直せます</p>';
  $('week').innerHTML=h+msg;
  $('week').querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>editWorkout(b.dataset.day));
}

let locked=false;
function openSheet(step){$('stepno').textContent=step||'';$('cancel').style.visibility=locked?'hidden':'';$('sheet').hidden=false;document.body.style.overflow='hidden';$('sheet').scrollTop=0;return $('sheetBody')}
function closeSheet(){$('sheet').hidden=true;document.body.style.overflow='';$('sheetBody').innerHTML=''}
$('cancel').onclick=closeSheet;
function shake(el){el.classList.remove('err');void el.offsetWidth;el.classList.add('err')}

function keypad(o){
  const body=openSheet(o.step);let v=o.initial!=null?String(o.initial):'';
  body.innerHTML='<p class="q">'+o.title+'</p>'+(o.note?'<p class="note">'+o.note+'</p>':'')+(o.presets?'<div class="chips" id="chips"></div>':'')+
    '<div class="display" id="disp"><span id="dv"></span><span class="u">'+o.unit+'</span></div><p class="err-msg" id="em"></p><div class="keys" id="keys"></div>';
  const show=()=>{$('dv').textContent=v||'0';$('dv').style.color=v?'':'var(--sub)'};
  (o.presets||[]).forEach(p=>{const b=document.createElement('button');b.className='chip';
    b.innerHTML='<b>'+p.label+'</b>'+(p.sub?'<small>'+p.sub+'</small>':'');b.onclick=()=>p.pick(x=>{v=String(x);show()});$('chips').appendChild(b)});
  ['1','2','3','4','5','6','7','8','9',o.decimal?'.':'','0','⌫'].forEach(k=>{
    const b=document.createElement('button');b.className='key';b.textContent=k;if(!k)b.style.visibility='hidden';
    b.setAttribute('aria-label',k==='⌫'?'1文字消す':k);
    b.onclick=()=>{$('em').textContent='';
      if(k==='⌫')v=v.slice(0,-1);
      else if(k==='.'){if(!v.includes('.'))v=(v||'0')+'.'}
      else{if(v==='0')v='';const nv=v+k;if(nv.replace('.','').length<=5&&!(nv.includes('.')&&nv.split('.')[1].length>1))v=nv}
      show()};
    $('keys').appendChild(b)});
  const ok=document.createElement('button');ok.className='okbtn';ok.textContent=o.okLabel||'次へ';
  ok.onclick=()=>{const n=parseFloat(v||'0');
    if(isNaN(n)||n<o.min||n>o.max){$('em').textContent=o.min+'〜'+o.max+o.unit+'の数字を入れてください';shake($('disp'));return}
    o.done(n)};
  $('keys').appendChild(ok);show();
}
function choice(o){
  const body=openSheet(o.step);
  body.innerHTML='<p class="q">'+o.title+'</p>'+(o.note?'<p class="note '+(o.warn?'warn':'')+'">'+o.note+'</p>':'')+'<div class="choices" id="ch"></div>';
  o.choices.forEach(c=>{const b=document.createElement('button');b.className='choice'+(c.danger?' danger':'');
    b.innerHTML=c.label+(c.sub?'<small>'+c.sub+'</small>':'');b.onclick=c.pick;$('ch').appendChild(b)});
}
function textStep(o){
  const body=openSheet(o.step);
  body.innerHTML='<p class="q">'+o.title+'</p><p class="note">'+o.note+'</p><input class="tinput" id="ti" maxlength="20" placeholder="'+o.placeholder+'" value="'+esc(o.initial||'')+'"><p class="err-msg" id="em"></p>'+
    '<div style="margin-top:auto"><button class="okbtn" id="tok">次へ</button></div>';
  const go=()=>{const s=$('ti').value.trim();if(!s){$('em').textContent='名前を入れてください';shake($('ti'));return}o.done(s)};
  $('tok').onclick=go;$('ti').onkeydown=e=>{if(e.key==='Enter')go()};setTimeout(()=>$('ti').focus(),50);
}

function flowDish(ts){

function confirmDish(d,ts){
  const SIZES=[['少なめ',0.8],['普通',1],['大盛り',1.3]];let si=1;
  const body=openSheet('');
  body.innerHTML='<p class="q">'+esc(d[0])+'</p><p class="note">量を選んでください。OKなら記録して、次から選べるように登録します</p>'+

    '<button class="subbtn" id="cFix">✏️ 数字を直してから登録</button><button class="subbtn" id="cOnly">記録だけ（登録しない）</button></div>';
  const cur=()=>{const m=SIZES[si][1];return{k:Math.round(d[1]*m),p:r1(d[2]*m),nm:si===1?d[0]:d[0]+'（'+SIZES[si][0]+'）'}};
  function draw(){
    $('sz').innerHTML='';
    SIZES.forEach((z,i)=>{const b=document.createElement('button');b.className='size'+(i===si?' on':'');
      b.innerHTML=z[0]+'<small>×'+z[1]+'</small>';b.onclick=()=>{si=i;draw()};$('sz').appendChild(b)});
    const c=cur();
    $('es').innerHTML='<div class="estbox"><div class="k">カロリー</div><div class="v">'+fmt(c.k)+'<small> kcal</small></div></div>'+
      '<div class="estbox"><div class="k">タンパク質</div><div class="v">'+f1(c.p)+'<small> g</small></div></div>';
  }
  const saveIt=(nm,k,p,reg)=>{closeSheet();commit(nm+(reg?'を記録・登録しました':'を記録しました'),()=>{
    S.meals.push({ts,kcal:k,protein:p,name:nm});
    if(reg){const ex=S.foods.find(f=>f.name===nm);if(ex){ex.kcal=k;ex.protein=p;ex.uses=(ex.uses||0)+1}else S.foods.push({id:'f'+Date.now(),name:nm,kcal:k,protein:p,uses:1})}})};
  $('cOk').onclick=()=>{const c=cur();saveIt(c.nm,c.k,c.p,true)};
  $('cOnly').onclick=()=>{const c=cur();saveIt(c.nm,c.k,c.p,false)};
  $('cFix').onclick=()=>{const c=cur();numSteps(['1 / 2','2 / 2'],(k,p)=>saveIt(c.nm,k,p,true),'記録して登録',{kcal:c.k,protein:c.p})};
  draw();
}
function numSteps(steps,done,okLabel,init){
  init=init||{};
  keypad({step:steps[0],title:'カロリーは？',note:'商品の栄養成分表示を見て入力してください',unit:'kcal',min:0,max:3000,initial:init.kcal,
    done:k=>keypad({step:steps[1],title:'タンパク質は？',note:'小数点も入力できます。わからなければ 0 でOK',unit:'g',decimal:true,min:0,max:300,initial:init.protein,okLabel,
      done:p=>done(Math.round(k),r1(p))})});
}

/* ===== 体重 ===== */
function flowWeight(){
  const k=vKey(),ex=S.weights.find(w=>w.date===k);
  keypad({step:'',title:(isToday()?'今日':dayLabel(k))+'の体重は？',note:ex?'すでに '+f1(ex.kg)+'kg が入っています。入れ直すと上書きします':'朝、トイレのあとにはかるのがおすすめ',
    unit:'kg',decimal:true,min:20,max:300,initial:ex?ex.kg:curWeight(),okLabel:'記録する',
    done:kg=>{closeSheet();commit('体重を記録しました',()=>{S.weights=S.weights.filter(w=>w.date!==k);S.weights.push({date:k,kg:r1(kg)})})}});
}

/* ===== 運動 ===== */
function flowEx(){
  const y=workoutOn(shiftKey(vKey(),-1)),yStr=y&&y.strength;
  choice({step:'1 / 2',title:(isToday()?'今日':dayLabel(vKey()))+'、筋トレをしましたか？',warn:yStr,
    note:yStr?'前の日も筋トレしています。筋肉を休ませるため、今日はお休みがおすすめです':'筋トレ → 有酸素運動の順がおすすめです',
    choices:[{label:'💪 した',sub:'このあと有酸素運動の時間を入れます',pick:()=>cardio(true)},{label:'していない',sub:'有酸素運動だけ記録します',pick:()=>cardio(false)}]});
}
function cardio(str,init){
  const presets=[S.commuteMin?{label:'🚲 通勤',sub:'往復 '+S.commuteMin+'分',pick:set=>set(S.commuteMin)}
    :{label:'🚲 通勤',sub:'時間を登録する',pick:()=>setCommute(()=>cardio(str,S.commuteMin))}]
    .concat([10,20,30,45,60].map(n=>({label:n+'分',pick:set=>set(n)})));
  keypad({step:'2 / 2',title:'有酸素運動は何分？',note:'自転車通勤・ウォーキング・ジョギングなど。少し息が弾む程度が目安。していなければ 0',unit:'分',min:0,max:600,initial:init,okLabel:'記録する',presets,
    done:m=>{closeSheet();const k=vKey();commit('運動を記録しました',()=>{let w=workoutOn(k);if(!w){w={date:k,strength:false,cardio:0};S.workouts.push(w)}
      w.strength=w.strength||str;w.cardio+=Math.round(m)})}});
}
function setCommute(next){
  keypad({step:'',title:'通勤の自転車は往復で何分？',note:'信号待ちを除いた、こいでいる時間の合計が目安です',unit:'分',min:1,max:300,initial:S.commuteMin,okLabel:'登録する',
    done:m=>{S.commuteMin=Math.round(m);save();if(next)next();else{closeSheet();toast('通勤時間を登録しました')}}});
}
$('bMeal').onclick=flowMeal;$('bWeight').onclick=flowWeight;$('bEx').onclick=flowEx;

/* ===== 性別 ===== */
function askSex(next){
  choice({step:locked?'はじめに 2 / 2':'',title:'性別を教えてください',note:'カロリーとタンパク質の標準目標を計算するのに使います',
    choices:[{label:'男性',pick:()=>{S.sex='m';save();next()}},{label:'女性',pick:()=>{S.sex='f';save();next()}}]});
}

/* ===== 日付・修正 ===== */
const dayLabel=k=>{const d=parseKey(k);return (d.getMonth()+1)+'月'+d.getDate()+'日'};
$('dPrev').onclick=()=>{viewKey=shiftKey(vKey(),-1);render();window.scrollTo(0,0)};
$('dNext').onclick=()=>{const n=shiftKey(vKey(),1);viewKey=n>=todayKey()?null:n;render();window.scrollTo(0,0)};
function timeStep(o){
  const body=openSheet('');
  body.innerHTML='<p class="q">'+o.title+'</p><p class="note">時刻の部分を押すと変えられます</p><input type="time" class="timein" id="tin" value="'+o.initial+'">'+
    '<div style="margin-top:auto;padding-top:16px"><button class="okbtn" id="tok">変更する</button></div>';
  $('tok').onclick=()=>{if($('tin').value)o.done($('tin').value)};
}
function editMeal(ts){
  const m=S.meals.find(x=>x.ts===ts);if(!m)return;
  const reg=m.name&&S.foods.find(f=>f.name===m.name);
  choice({step:'',title:(m.name?esc(m.name):'食事')+'（'+hm(new Date(m.ts))+'）',note:fmt(m.kcal)+'kcal・'+f1(m.protein)+'g',choices:[
    {label:'✏️ 数字を直す',sub:'カロリー・タンパク質（小数点OK）',pick:()=>numSteps(['1 / 2','2 / 2'],(k,p)=>{
      const apply=also=>{closeSheet();commit('食事を直しました',()=>{const t=S.meals.find(x=>x.ts===ts);if(t){t.kcal=k;t.protein=p}
        if(also){const f=S.foods.find(f=>f.name===m.name);if(f){f.kcal=k;f.protein=p}}})};
      if(reg)choice({step:'',title:'登録した「'+esc(m.name)+'」も直しますか？',note:'「はい」にすると、次から選ぶときの数字も変わります',
        choices:[{label:'はい、両方直す',pick:()=>apply(true)},{label:'この記録だけ直す',pick:()=>apply(false)}]});
      else apply(false)},'直す',{kcal:m.kcal,protein:m.protein})},
    {label:'🕒 時刻を変える',sub:'今は '+hm(new Date(m.ts)),pick:()=>timeStep({title:'食べた時刻は？',initial:hm(new Date(m.ts)),done:tv=>{
      const d=new Date(m.ts);const[h,mi]=tv.split(':');d.setHours(+h,+mi,0,0);closeSheet();
      commit('時刻を直しました',()=>{const x=S.meals.find(x=>x.ts===ts);if(x)x.ts=uniqTs(d.getTime())})}})},
    {label:'🗑 この記録を消す',danger:true,pick:()=>{closeSheet();commit('食事の記録を消しました',()=>{S.meals=S.meals.filter(x=>x.ts!==ts)})}}
  ]});
}
function editWorkout(k){
  const w=workoutOn(k)||{strength:false,cardio:0};
  const upd=fn=>{closeSheet();commit(dayLabel(k)+'の運動を直しました',()=>{let x=workoutOn(k);if(!x){x={date:k,strength:false,cardio:0};S.workouts.push(x)}fn(x);
    if(!x.strength&&!x.cardio)S.workouts=S.workouts.filter(y=>y.date!==k)})};
  choice({step:'',title:dayLabel(k)+'の運動',note:'筋トレ：'+(w.strength?'した':'していない')+'／有酸素：'+w.cardio+'分',choices:[
    {label:w.strength?'💪 筋トレを「していない」に直す':'💪 筋トレを「した」に直す',pick:()=>upd(x=>{x.strength=!w.strength})},
    {label:'🏃 有酸素の時間を直す',sub:'入れた数字で上書きします',pick:()=>keypad({step:'',title:'有酸素運動は合計何分？',unit:'分',min:0,max:600,initial:w.cardio,okLabel:'直す',
      presets:S.commuteMin?[{label:'🚲 通勤',sub:'往復 '+S.commuteMin+'分',pick:set=>set(S.commuteMin)}]:null,done:m=>upd(x=>{x.cardio=Math.round(m)})})},
    {label:'🗑 この日の運動を消す',danger:true,pick:()=>upd(x=>{x.strength=false;x.cardio=0})}
  ]});
}
function editFood(f){
  choice({step:'',title:esc(f.name),note:fmt(f.kcal)+'kcal・'+f1(f.protein)+'g',choices:[
    {label:'✏️ 数字を直す',sub:'カロリー・タンパク質（小数点OK）',pick:()=>numSteps(['1 / 2','2 / 2'],(k,p)=>{closeSheet();
      commit(f.name+'を直しました',()=>{const x=S.foods.find(x=>x.id===f.id);if(x){x.kcal=k;x.protein=p}})},'直す',{kcal:f.kcal,protein:f.protein})},
    {label:'🏷 名前を変える',pick:()=>textStep({step:'',title:'新しい名前は？',note:'これまでの記録の名前はそのままです',placeholder:'',initial:f.name,
      done:n=>{closeSheet();commit('名前を変えました',()=>{const x=S.foods.find(x=>x.id===f.id);if(x)x.name=n})}})},
    {label:'🗑 削除する',danger:true,pick:()=>{closeSheet();commit(f.name+'を削除しました',()=>{S.foods=S.foods.filter(x=>x.id!==f.id)})}}
  ]});
}

/* ===== 食べ物の管理 ===== */
function manageFoods(){
  const body=openSheet('');
  body.innerHTML='<p class="q">登録した食べ物</p><p class="note">押すと、数字や名前を直したり削除したりできます。これまでの記録は変わりません</p><div class="list" id="lst"></div>';
  if(!S.foods.length)$('lst').innerHTML='<p class="empty">登録はありません</p>';
  S.foods.forEach(f=>{const r=document.createElement('button');r.className='row';
    r.innerHTML='<span class="v"><b>'+esc(f.name)+'</b><br><small>'+fmt(f.kcal)+'kcal・'+f1(f.protein)+'g</small></span><span class="go">›</span>';
    r.onclick=()=>editFood(f);r.style.cursor='pointer';
    $('lst').appendChild(r)});
}

/* ===== 設定 ===== */
$('gear').onclick=()=>{const t=T();choice({step:'',title:'設定',note:'データはこのスマホのブラウザの中だけに保存されています',choices:[
  {label:'🏁 体重の目標を変える',sub:'ハード −'+t.lossHard+'kg／標準 −'+t.lossStd+'kg（開始体重の3%）',pick:()=>keypad({step:'',title:'ハード目標：何kg減らしますか？',note:'標準目標は開始体重の3%（ハードより小さい値）で自動計算します',unit:'kg',decimal:true,min:0.5,max:30,initial:S.goalLoss,okLabel:'変更する',
    done:kg=>{closeSheet();commit('ハード目標を −'+r1(kg)+'kg に変えました',()=>{S.goalLoss=r1(kg)})}})},
  {label:'🍙 登録した食べ物',sub:S.foods.length+'件・削除はここから',pick:manageFoods},
  {label:'🚲 通勤の時間',sub:S.commuteMin?'往復 '+S.commuteMin+'分':'未登録',pick:()=>setCommute()},
  {label:'👤 性別',sub:S.sex==='f'?'女性':'男性',pick:()=>askSex(()=>{closeSheet();render();toast('性別を変更しました')})},
  {label:'🎯 開始体重を変える',sub:'今は '+f1(S.startWeight)+'kg',pick:()=>keypad({step:'',title:'開始体重は？',unit:'kg',decimal:true,min:20,max:300,initial:S.startWeight,okLabel:'変更する',
    done:kg=>{closeSheet();commit('開始体重を変えました',()=>{S.startWeight=r1(kg)})}})},
  {label:'💾 バックアップを保存',sub:'ファイルとしてダウンロード',pick:()=>{const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='karada-backup-'+todayKey()+'.json';a.click();closeSheet()}},
  {label:'📂 バックアップから戻す',sub:'保存したファイルを選ぶ',pick:()=>{const i=document.createElement('input');i.type='file';i.accept='.json';
    i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(!Array.isArray(v.weights))throw 0;
      closeSheet();commit('バックアップを戻しました',()=>{localStorage.setItem(KEY,JSON.stringify(v));S=load()})}catch(e){toast('このファイルは読み込めません')}};r.readAsText(i.files[0])};i.click()}},
  {label:'🗑 すべて消す',sub:'最初からやり直す',danger:true,pick:()=>choice({step:'',title:'本当にすべて消しますか？',note:'消すと元に戻せません。先にバックアップがおすすめです',warn:true,
    choices:[{label:'消す',danger:true,pick:()=>{S=blank();save();S=load();closeSheet();setup()}},{label:'やめる',pick:closeSheet}]})}
]})};

/* ===== お知らせ ===== */
let tTimer;
function toast(msg,undo){$('toastMsg').textContent=msg;$('toastUndo').hidden=!undo;$('toastUndo').onclick=()=>{$('toast').hidden=true;undo()};
  $('toast').hidden=false;clearTimeout(tTimer);tTimer=setTimeout(()=>$('toast').hidden=true,undo?5000:2500)}

/* ===== 初回 ===== */
function finishSetup(){locked=false;closeSheet();render();const t=T();
  toast('目標：標準 '+f1(S.startWeight-t.lossStd)+'kg／ハード '+f1(S.startWeight-t.lossHard)+'kg')}
function setup(){
  locked=true;
  keypad({step:'はじめに 1 / 2',title:'今の体重を入れてください',note:'標準（開始体重の3%減）とハード（−5kg）の2つの目標を作ります。あとで⚙️設定から変えられます',
    unit:'kg',decimal:true,min:20,max:300,
    done:kg=>{kg=r1(kg);S.startWeight=kg;S.startDate=todayKey();S.weights=[{date:todayKey(),kg}];save();askSex(finishSetup)}});
}

if(!S.startWeight)setup();
else if(!S.sex){locked=true;askSex(finishSetup)}
else render();
setInterval(()=>{if(S.startWeight&&S.sex)renderClock()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.startWeight&&S.sex)render()});
</script>
</body>
</html>
